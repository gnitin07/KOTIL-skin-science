<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1b2a" />
    <!-- Google Search Console ownership — must stay in place permanently;
         Google re-checks it and unverifies the property if it disappears. -->
    <meta name="google-site-verification" content="EeGOF9-tttqotOAL1qtkJpjpXooDi6i89yAs4WAl_p4" />

    <title>Kotil Skin Science | Skin, Hair &amp; Body Clinic in Preet Vihar, East Delhi</title>
    <!-- Mirrors the description Google already indexes for this domain, so the
         snippet survives the WordPress -> new-site switchover. -->
    <meta name="description" content="Trusted skin, hair & body clinic in Preet Vihar, East Delhi — advanced treatments for acne, pigmentation, hair fall, laser hair reduction, HIFU & hydra facials." />
    <link rel="canonical" href="https://kotilskinscience.com/" />

    <!-- Open Graph / WhatsApp / social previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kotil Skin Science" />
    <meta property="og:title" content="Kotil Skin Science | Skin, Hair & Body Clinic in Preet Vihar" />
    <meta property="og:description" content="Advanced treatments for acne, pigmentation, hair fall, laser hair reduction, HIFU & hydra facials. Doctor-led care in Preet Vihar, East Delhi." />
    <meta property="og:url" content="https://kotilskinscience.com/" />
    <meta property="og:image" content="https://kotilskinscience.com/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kotil Skin Science | Skin, Hair & Body Clinic in Preet Vihar" />
    <meta name="twitter:description" content="Advanced treatments for acne, pigmentation, hair fall, laser hair reduction, HIFU & hydra facials in Preet Vihar, East Delhi." />
    <meta name="twitter:image" content="https://kotilskinscience.com/og.jpg" />

    <!-- Local business schema: address, hours (closed Tuesdays) and phone,
         matching config.js. Update BOTH if the clinic's details change. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MedicalClinic",
      "name": "Kotil Skin Science",
      "url": "https://kotilskinscience.com/",
      "image": "https://kotilskinscience.com/og.jpg",
      "telephone": "+919871054183",
      "email": "info@kotilskinscience.com",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Plot No-8, Shankar Vihar, Preet Vihar",
        "addressLocality": "New Delhi",
        "addressRegion": "Delhi",
        "postalCode": "110092",
        "addressCountry": "IN"
      },
      "openingHoursSpecification": [{
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
        "opens": "09:00",
        "closes": "20:00"
      }],
      "sameAs": [
        "https://www.instagram.com/kotil.skinscience/",
        "https://www.facebook.com/kotilskinscience/",
        "https://x.com/Kotilskins21295",
        "https://in.pinterest.com/kotilskinscience/"
      ]
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- One family, full weight range. Hierarchy comes from weight + tracking,
         not from mixing typefaces. -->
    <!-- Weights must match what index.css actually sets. 900 was requested but
         never used anywhere, which cost an extra woff2 download per visitor. -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
